<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mock ERP{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #172033; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; color: white; background: #173a6b; }
    header h1 { margin: 0; font-size: 20px; }
    main { max-width: 1120px; margin: 32px auto; padding: 0 20px; }
    .card { background: white; border: 1px solid #dfe6ef; border-radius: 12px; box-shadow: 0 8px 24px #203b5f12; padding: 24px; }
    label { display: block; font-weight: 650; margin: 14px 0 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #bdc9d8; border-radius: 7px; font: inherit; }
    button, .button { display: inline-block; border: 0; border-radius: 7px; padding: 10px 16px; background: #1769aa; color: white; font: inherit; text-decoration: none; cursor: pointer; }
    .secondary { background: #eaf0f7; color: #173a6b; }
    .message { margin: 16px 0; padding: 11px 14px; border-radius: 7px; background: #fff4d6; color: #704f00; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 14px; }
    th, td { padding: 11px 9px; border-bottom: 1px solid #e5eaf0; text-align: left; white-space: nowrap; }
    th { color: #4b5b70; background: #f7f9fc; }
    .toolbar { display: flex; align-items: end; gap: 10px; }
    .toolbar div { flex: 1; }
    .details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { padding: 14px; border-radius: 8px; background: #f7f9fc; }
    .field span { display: block; color: #637187; font-size: 13px; margin-bottom: 4px; }
    form.inline { margin: 0; }
    form.inline button { padding: 7px 11px; background: #ffffff22; }
    @media (max-width: 720px) { .details { grid-template-columns: 1fr; } .table-wrap { overflow-x: auto; } }
  </style>
</head>
<body>
  <header>
    <h1>企业订单管理系统 · Mock ERP</h1>
    {% block header_action %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
