{% extends "base.html" %}
{% block title %}登录 · Mock ERP{% endblock %}
{% block content %}
<section class="card" style="max-width: 420px; margin: 72px auto;">
  <h2>员工登录</h2>
  <p>请输入本地演示环境的 ERP 凭证。</p>
  {% if error %}<div class="message" data-testid="login-error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <label for="username">用户名</label>
    <input id="username" name="username" data-testid="username" autocomplete="username" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password" required>
    <button type="submit" data-testid="login-submit" style="width: 100%; margin-top: 20px;">登录</button>
  </form>
</section>
{% endblock %}
